# Every gate on every pull request (docs/src/design/guardrails.md). `gates` runs exactly what
# contributors run locally — `cargo xtask ci` — with the optional tools installed, so nothing is skipped.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  gates:
    name: gates (cargo xtask ci)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned toolchain (rust-toolchain.toml) and the wasm target
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny,typos,mdbook
      - name: The independent reader for REQ-FMT-005 (pyembroidery, pinned by hash)
        run: |
          python3 -m venv "$RUNNER_TEMP/oracle-venv"
          "$RUNNER_TEMP/oracle-venv/bin/pip" install --require-hashes -r conformance/oracle/requirements.txt
          echo "STITCHCRAFT_PYTHON=$RUNNER_TEMP/oracle-venv/bin/python" >> "$GITHUB_ENV"
      - run: cargo xtask ci

  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked

  msrv:
    name: msrv (Rust 1.95, same floor as VectorCraft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.95.0 check --workspace --locked
