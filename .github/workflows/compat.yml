# VectorCraft compatibility gate (docs/src/design/compatibility-gate.md).
#
# Daily: find VectorCraft's latest stable release, latest pre-release (alpha/beta/rc), and the heads of its
# `release` and `main` branches; load our freshly built plug-in into VectorCraft's real plug-in host at each
# of them (Level A contract tests). Pull requests that touch the plug-in test the pinned stable version.
# A failing scheduled run opens or updates one issue labelled `upstream-canary`.
# Level B (end-to-end with vectorcraft-cli), the bot PR for new versions and the generated support table
# arrive with roadmap step M6.6.
name: compat

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/stitchcraft-vc-plugin/**"
      - "compat/**"
      - "xtask/src/compat.rs"
      - ".github/workflows/compat.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      report: ${{ steps.discover.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: discover
        name: Discover VectorCraft releases, pre-releases and branch heads
        run: |
          echo "report=$(cargo xtask compat discover --json)" >> "$GITHUB_OUTPUT"
          { echo '```'; cargo xtask compat discover; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  contract:
    name: contract (${{ matrix.track }})
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        track: ${{ github.event_name == 'pull_request' && fromJSON('["stable"]') || fromJSON('["stable","prerelease","release-branch","main"]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Resolve the VectorCraft ref for this track
        id: ref
        env:
          REPORT: ${{ needs.discover.outputs.report }}
          TRACK: ${{ matrix.track }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$TRACK" in
            stable)
              if [ "$EVENT" = pull_request ]; then ref=$(jq -r '.stable.pinned' <<<"$REPORT");
              else ref=$(jq -r '.stable.latest // empty' <<<"$REPORT"); fi ;;
            prerelease)     ref=$(jq -r '.prerelease.latest // empty' <<<"$REPORT") ;;
            release-branch) ref=$(jq -r '."release-branch".sha // empty' <<<"$REPORT") ;;
            main)           ref=$(jq -r '.main.sha // empty' <<<"$REPORT") ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Build the plug-in for wasm32
        if: steps.ref.outputs.ref != ''
        run: cargo build -p stitchcraft-vc-plugin --release --locked --target wasm32-unknown-unknown
      - name: Contract tests against VectorCraft ${{ steps.ref.outputs.ref }}
        if: steps.ref.outputs.ref != ''
        run: >
          cargo xtask compat contract --ref "${{ steps.ref.outputs.ref }}"
          --wasm target/wasm32-unknown-unknown/release/stitchcraft_vc_plugin.wasm
      - name: Nothing to test on this track
        if: steps.ref.outputs.ref == ''
        run: echo "VectorCraft has no ${{ matrix.track }} build right now." >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [discover, contract]
    if: always() && github.event_name == 'schedule' && needs.contract.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the upstream-canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="VectorCraft compatibility gate failing"
          gh label create upstream-canary --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "A VectorCraft release, pre-release or branch breaks the plug-in" --force
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label upstream-canary \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="The scheduled compatibility run failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label upstream-canary --body "$body"
          fi
