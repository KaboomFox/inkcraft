# Mutation testing, weekly, and on pull requests that change its setup (docs/src/design/guardrails.md ›
# Mutation testing). cargo-mutants changes the
# shipped code in small ways and runs the changed crate's tests on each change (.cargo/mutants.toml); a
# change no test notices is a behaviour nobody checks. The mutants run in four parts, dealt round-robin
# so every part gets a fair share of each crate; `cargo xtask mutants` then adds them up per crate and
# fails when a crate has more missed mutants than conformance/mutation.toml records. The job summary
# lists every missed mutant.
name: mutants

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
  # A pull request that changes how mutation testing runs, or what it compares with, runs it too.
  pull_request:
    paths:
      - .cargo/mutants.toml
      - conformance/mutation.toml
      - xtask/src/mutants.rs
      - .github/workflows/mutants.yml

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  shard:
    name: mutants, part ${{ matrix.part }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-mutants@27.1.0
      - name: Run this shard's mutants
        # cargo-mutants exits non-zero when it finds missed mutants; the comparison job decides. A mutant
        # that makes a test run away is stopped by cargo-mutants' timeout, which counts apart.
        # cargo-mutants numbers its shards from 0. Its default sharding cuts the list, which is in source
        # order, into consecutive slices: one part got all of stitchcraft-formats' mutants, whose tests are
        # the slowest, and took 23 minutes while the others took 4 to 7. Round-robin deals them out evenly.
        run: |
          cargo mutants --workspace --shard $(( ${{ matrix.part }} - 1 ))/4 --sharding round-robin --output "part-${{ matrix.part }}" || status=$?
          echo "cargo mutants exited with ${status:-0}"
          test -f "part-${{ matrix.part }}/mutants.out/outcomes.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-part-${{ matrix.part }}
          path: |
            part-${{ matrix.part }}/mutants.out/*.txt
            part-${{ matrix.part }}/mutants.out/outcomes.json

  compare:
    name: no crate with more missed mutants than recorded
    needs: shard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-part-*
          path: parts
      - name: Add up the parts and compare
        run: |
          dirs=()
          for part in parts/mutants-part-*; do
            mkdir -p "$part/mutants.out" && mv "$part"/*.txt "$part"/*.json "$part/mutants.out/"
            dirs+=("$part")
          done
          cargo xtask mutants "${dirs[@]}"
