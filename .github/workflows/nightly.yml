# Nightly checks that are too slow or too noisy for every pull request.
# Fuzzing, fresh-seed property tests, mutation testing, coverage and the Ink/Stitch differential run are
# added with their roadmap steps (M2.5, M2.8, M8).
name: nightly

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  newest-rust:
    name: gates on the newest stable Rust (catches new lints early)
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown --toolchain stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny,typos,mdbook
      - run: cargo xtask ci

  external-links:
    name: external links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: lychee
      - run: lychee --no-progress --max-concurrency 4 --accept 200,429 './*.md' 'docs/src/**/*.md' 'crates/*/README.md' 'apps/*/README.md'
