# Prose lint for StitchCraft's docs: `cargo xtask prose` (docs/src/contributing/writing-style.md).
#
# Two styles, both kept in the repository so every run reads the same rules:
# - ai-tells: phrasing and punctuation typical of machine-written text (vale-ai-tells v1.37.0, MIT,
#   vendored unchanged in .vale/styles/ai-tells/; to update, copy a newer release's styles/ai-tells).
# - StitchCraft: the house rules: project names and plain statements about software.
#
# `cargo xtask prose` checks only lines added since the merge base with origin/main, so new and
# changed prose is held to the rules while older pages are rewritten in their own time.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = ai-tells, StitchCraft
# Shapes are literal here: SVG shapes and the engine's shapes. The rule's own message says to turn it
# off for geometry prose.
ai-tells.FigurativeShape = NO
# "The message names the element" is how this reference prose says which element; the rule's message
# says to turn it off for API reference prose.
ai-tells.BareNames = NO
