# Mutants no test notices, per crate (`cargo xtask mutants`, docs/src/design/guardrails.md). The weekly
# mutants.yml run fails when a crate has more. `cargo xtask mutants --record …` lowers the counts to
# today's and never raises one: raise a count only by hand, in a pull request that says why.

[missed]
stitchcraft-cli = 23
stitchcraft-core = 13
stitchcraft-engine = 39
stitchcraft-formats = 46
stitchcraft-params = 0
stitchcraft-plan = 48
stitchcraft-render = 26
stitchcraft-svg = 1
stitchcraft-vc-plugin = 22

# Mutants that change nothing a test could observe. A pull request may leave these in the lines it
# changes (`cargo xtask mutants --changed`); any other mutant there that no test notices fails it.

[[equivalent]]
file = "crates/stitchcraft-svg/src/path.rs"
mutant = "replace < with <= in arc"
line = "if large_arc && turn < FRAC_PI_2 {"
why = "a large arc turns at least half way round, so no turn reaching this test is exactly π/2"

[[equivalent]]
file = "crates/stitchcraft-engine/src/locks/mod.rs"
mutant = "replace < with <= in Stitching::follow"
line = "while length < reach {"
why = "when the stitching read so far is exactly as long as the lock reaches, one more needle point read changes no position: the farthest one is the last point read either way"
