# Mutants no test notices, per crate (`cargo xtask mutants`, docs/src/design/guardrails.md). The weekly
# mutants.yml run fails when a crate has more. `cargo xtask mutants --record …` lowers the counts to
# today's and never raises one: raise a count only by hand, in a pull request that says why.

[missed]
stitchcraft-cli = 23
stitchcraft-core = 13
stitchcraft-engine = 39
stitchcraft-formats = 46
stitchcraft-params = 0
stitchcraft-plan = 48
stitchcraft-render = 26
stitchcraft-svg = 1
stitchcraft-vc-plugin = 22

# Mutants that change nothing a test could observe. A pull request may leave these in the lines it
# changes (`cargo xtask mutants --changed`); any other mutant there that no test notices fails it.

[[equivalent]]
file = "crates/stitchcraft-svg/src/path.rs"
mutant = "replace < with <= in arc"
line = "if large_arc && turn < FRAC_PI_2 {"
why = "a large arc turns at least half way round, so no turn reaching this test is exactly π/2"

[[equivalent]]
file = "crates/stitchcraft-engine/src/locks/mod.rs"
mutant = "replace < with <= in Stitching::follow"
line = "while length < reach {"
why = "when the stitching read so far is exactly as long as the lock reaches, one more needle point read changes no position: the farthest one is the last point read either way"

[[equivalent]]
file = "crates/stitchcraft-engine/src/generators/satin/compensation.rs"
mutant = "replace < with <= in offset"
line = "if by_a + by_b < -width {"
why = "when the two moves add up to exactly minus the width, the scale is the width over itself, exactly 1, and multiplying by it changes neither move"

[[equivalent]]
file = "crates/stitchcraft-engine/src/normalize/near.rs"
mutant = "replace boxes_meet -> bool with true"
line = "a.x().min(b.x()).max(c.x().min(d.x())) <= a.x().max(b.x()).min(c.x().max(d.x()))"
why = "the box test only saves work: sides that cross, touch or overlap have boxes that overlap, so without it the side and crossing tests give the same answers"

[[equivalent]]
file = "crates/stitchcraft-engine/src/normalize/near.rs"
mutant = "replace && with || in boxes_meet"
line = "&& a.y().min(b.y()).max(c.y().min(d.y())) <= a.y().max(b.y()).min(c.y().max(d.y()))"
why = "the box test only saves work: letting more sides past it changes no answer, since the side and crossing tests after it find no meeting where the boxes are apart"

[[equivalent]]
file = "crates/stitchcraft-engine/src/normalize/near.rs"
mutant = "replace && with || in meeting"
line = "(d_on && (a_on || b_on)).then_some(d)"
why = "overlapping sides along one line: when neither end of the second lies on the first, an end of the first on the second would have to stick out past one of the second's ends, which would then lie on the first, so the changed test only adds cases that cannot occur"
