# StitchCraft conformance requirements.
#
# Each requirement is a testable statement with a stable id (never reused). `cargo xtask conformance
# --check` enforces: unique ids; `active` requirements have at least one passing case; ids mentioned in
# the docs exist here. See docs/src/design/conformance.md.
#
# status: planned | active | retired      level: L0 invariants · L1 formats · L2 generators ·
#                                                L3 Ink/Stitch differential · L4 physical

# ── Plan invariants (L0) ───────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-PLAN-001"
area = "plan"
level = "L0"
statement = "All stitch coordinates are finite and inside the profile's hoop."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-002"
area = "plan"
level = "L0"
statement = "While sewing (the previous movement was a Normal stitch, with no trim since), every stitch is no longer than the profile maximum and no shorter than the profile minimum, except lock stitches, which are at least 0.2 mm."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-003"
area = "plan"
level = "L0"
statement = "Every colour block sews at least one stitch, and trims and stops happen where the needle is. Colour changes and the end are implied by the block structure; encoders write exactly one colour change between blocks and exactly one end."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-004"
area = "plan"
level = "L0"
statement = "A Trim is preceded by a tie-off and followed by a tie-in before the next Normal stitch when lock settings request them."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-PLAN-005"
area = "plan"
level = "L0"
statement = "While sewing (the previous movement was a Normal stitch, with no trim since), no stitch lands where the needle already is."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-006"
area = "plan"
level = "L0"
statement = "The number of colour changes does not exceed the target format's maximum."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-007"
area = "plan"
level = "L0"
statement = "Every Normal and Jump entry names the element it came from."
milestone = "M3"
status = "planned"

# ── Machine profiles ───────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-PRF-001"
area = "profile"
level = "L2"
statement = "Built-in profiles validate (positive hoop, comfort zone inside hoop, min stitch < max stitch) and are listed by `stitch profiles`."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PRF-002"
area = "profile"
level = "L2"
statement = "A design larger than the hoop is an error (SC-E0701); larger than the comfort zone, a warning (SC-W0702) with a rotate-to-fit hint when rotating 90 degrees would fit."
rationale = "Ink/Stitch #2702 (hoop size awareness)."
milestone = "M1"
status = "active"

# ── Formats (L1) ───────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-FMT-001"
area = "formats"
level = "L1"
statement = "Canonical plans encode to the committed golden files byte for byte, for every writer."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-FMT-002"
area = "formats"
level = "L1"
statement = "decode(encode(plan)) equals quantize(plan) for every writer/reader pair, on random plans; quantization uses absolute positions and round-half-even."
milestone = "M2"
status = "planned"

[[req]]
id = "REQ-FMT-003"
area = "formats"
level = "L1"
statement = "Every command kind (jump, trim, stop, colour change, end) survives every writer/reader pair."
rationale = "Ink/Stitch #689 (PES trims ignored), #3544 (DST stops missing)."
milestone = "M2"
status = "planned"

[[req]]
id = "REQ-FMT-004"
area = "formats"
level = "L1"
statement = "Readers accept empty and zero-stitch files without failing; writers refuse to write an empty plan (SC-E0010)."
rationale = "Ink/Stitch #3041, #4039."
milestone = "M2"
status = "planned"

[[req]]
id = "REQ-FMT-005"
area = "formats"
level = "L1"
statement = "A pinned pyembroidery decodes our files to the same stitches as our own reader."
milestone = "M2"
status = "planned"

[[req]]
id = "REQ-FMT-006"
area = "formats"
level = "L1"
statement = "Fuzzed readers never panic, never allocate beyond their caps, and always terminate."
milestone = "M2"
status = "planned"

[[req]]
id = "REQ-FMT-007"
area = "formats"
level = "L1"
statement = "Moves longer than a format's per-record limit are split into several records within the limit."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-THREAD-001"
area = "threads"
level = "L1"
statement = "Palette tables match their published source at spot-checked entries; nearest-colour matching is deterministic (CIEDE2000 via libm)."
rationale = "Ink/Stitch #2668, #3137, #3274, #3257."
milestone = "M1"
status = "active"

# ── Rendering ──────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-RND-001"
area = "render"
level = "L2"
statement = "Previews render the plan after quantization, so what is shown is what sews."
rationale = "Ink/Stitch #2066."
milestone = "M2"
status = "planned"

# ── Parameters ─────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-PRM-001"
area = "params"
level = "L2"
statement = "Every registered parameter has a label, help text, kind, default, range or options, group and applicability."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-PRM-002"
area = "params"
level = "L2"
statement = "Invalid parameter values produce SC-E0101 or SC-W0102 with the key, the value and the accepted range; they never fall back silently to defaults."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-PRM-003"
area = "params"
level = "L2"
statement = "Parameters round-trip unchanged through every adapter (SVG attributes, VectorCraft effect records)."
rationale = "Ink/Stitch #3723 (settings reverted after save)."
milestone = "M3"
status = "planned"

# ── SVG adapter ────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-SVG-001"
area = "svg"
level = "L2"
statement = "Paths, groups, transforms, viewBox units, colours and visibility map to the Design exactly (positions within 1 micrometre)."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-SVG-002"
area = "svg"
level = "L2"
statement = "Any SVG path data, including degenerate arcs, is handled per the SVG specification without failing the adapter; fuzzed."
rationale = "Ink/Stitch #3342 (ZeroDivisionError converting an arc)."
milestone = "M3"
status = "planned"

# ── Generators: shared ─────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-GEN-001"
area = "generators"
level = "L2"
statement = "Every generator honours start and end hints: the first and last stitch lie within 0.1 mm of the shape point nearest each hint."
rationale = "Ink/Stitch #4153, #2576, #3084, #1903."
milestone = "M3"
status = "planned"

# ── Running stitch family ──────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-RUN-001"
area = "strokes/running"
level = "L2"
statement = "Top stitches are at most the stitch length times (1 + jitter) and at least the minimum stitch length unless the path is shorter."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-RUN-002"
area = "strokes/running"
level = "L2"
statement = "The stitched polyline deviates from the source curve by at most running_stitch_tolerance_mm."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-RUN-003"
area = "strokes/running"
level = "L2"
statement = "Corners (turning angle above 30 degrees) are needle penetrations."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-RUN-004"
area = "strokes/running"
level = "L2"
statement = "Bean stitch produces exactly n x (2b + 1) stitches for a span of n stitches."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-RUN-005"
area = "strokes/running"
level = "L2"
statement = "Repeats alternate direction; an odd count ends at the far end, an even count at the start."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-RUN-006"
area = "strokes/manual"
level = "L2"
statement = "Manual stitch outputs the path's nodes in order plus only the documented splits."
milestone = "M3"
status = "planned"

