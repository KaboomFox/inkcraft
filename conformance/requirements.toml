[[req]]
id = "REQ-LCK-001"
area = "plan/locks"
level = "L2"
statement = "Lock stitches appear where `ties` says (both, before, after, neither) and only there."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-LCK-002"
area = "plan/locks"
level = "L2"
statement = "Every lock id is accepted; lock shapes scale by the mm or percent parameter as documented."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-LCK-003"
area = "plan/locks"
level = "L4"
statement = "Default locks hold when the tail is pulled (machine test TS-04)."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-ASM-001"
area = "plan/assembly"
level = "L2"
statement = "Elements are stitched in document order; a thread change starts a new colour block."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-ASM-002"
area = "plan/assembly"
level = "L2"
statement = "Same-colour moves no longer than the collapse length are sewn; longer ones tie off, jump and tie in."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-ASM-003"
area = "plan/assembly"
level = "L2"
statement = "trim_after and stop_after produce a trim or stop with locks around it."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-ASM-004"
area = "plan/assembly"
level = "L2"
statement = "Ignored elements are dropped and listed in the report."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-ASM-005"
area = "plan/assembly"
level = "L2"
statement = "The origin command (or the bounds centre) becomes the machine origin; a stop position adds a jump before each stop."
milestone = "M3"
status = "planned"

# ── Satin ──────────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-SAT-001"
area = "satin"
level = "L2"
statement = "Every top stitch end lies on its rail offset outward by exactly the compensation (within 0.01 mm)."
milestone = "M4"
status = "planned"

[[req]]
id = "REQ-SAT-002"
area = "satin"
level = "L2"
statement = "Measured zigzag spacing on the centre line equals the parameter within 5 percent outside short-stitch zones."
milestone = "M4"
status = "planned"

[[req]]
id = "REQ-SAT-003"
area = "satin"
level = "L2"
statement = "No top stitch exceeds max_stitch_length_mm after splitting; split seams follow the chosen method."
milestone = "M4"
status = "planned"

[[req]]
id = "REQ-SAT-004"
area = "satin"
level = "L2"
statement = "Underlays lie inside their inset band and precede the top stitches."
milestone = "M4"
status = "planned"

[[req]]
id = "REQ-SAT-005"
