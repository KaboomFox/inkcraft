# StitchCraft conformance requirements.
#
# Each requirement is a testable statement with a stable id (never reused). `cargo xtask conformance
# --check` enforces: unique ids; `active` requirements have at least one passing case; ids mentioned in
# the docs exist here. See docs/src/design/conformance.md.
#
# status: planned | active | retired      level: L0 invariants · L1 formats · L2 generators ·
#                                                L3 Ink/Stitch differential · L4 physical

# ── Plan invariants (L0) ───────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-PLAN-001"
area = "plan"
level = "L0"
statement = "All stitch coordinates are finite and inside the profile's hoop."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-002"
area = "plan"
level = "L0"
statement = "While sewing (the previous movement was a Normal stitch, with no trim since), every stitch is no longer than the profile maximum and no shorter than the profile minimum, except lock stitches — into or out of a lock point — which are at least 0.2 mm."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-003"
area = "plan"
level = "L0"
statement = "Every colour block sews at least one stitch, and trims and stops happen where the needle is. Colour changes and the end are implied by the block structure; encoders write exactly one colour change between blocks and exactly one end."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-004"
area = "plan"
level = "L0"
statement = "A Trim is preceded by a tie-off and followed by a tie-in before the next Normal stitch when lock settings request them."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-PLAN-005"
area = "plan"
level = "L0"
statement = "While sewing (the previous movement was a Normal stitch, with no trim since), no stitch lands where the needle already is."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-006"
area = "plan"
level = "L0"
statement = "The number of colour changes does not exceed the target format's maximum."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-007"
area = "plan"
level = "L0"
statement = "Every Normal and Jump entry names the element it came from."
milestone = "M3"
status = "planned"

# ── Machine profiles ───────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-PRF-001"
area = "profile"
level = "L2"
statement = "Built-in profiles validate (positive hoop, comfort zone inside hoop, min stitch < max stitch) and are listed by `stitch profiles`."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PRF-002"
area = "profile"
level = "L2"
statement = "A design larger than the hoop is an error (SC-E0701); larger than the comfort zone, a warning (SC-W0702) with a rotate-to-fit hint when rotating 90 degrees would fit."
rationale = "A design that does not fit the hoop must be caught before sewing, not at the machine."
milestone = "M1"
status = "active"

# ── Formats (L1) ───────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-FMT-001"
area = "formats"
level = "L1"
statement = "Canonical plans encode to the committed golden files byte for byte, for every writer."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-FMT-002"
area = "formats"
level = "L1"
statement = "For every writer/reader pair, decode(encode(plan)) makes the machine do what the plan does: the needle goes down at the same positions (absolute positions quantized to 0.1 mm, round half to even), and the thread is cut and the machine pauses at the same places (stitchcraft-testkit::equivalence), on random plans with fixed seeds per PR and fresh seeds nightly. A DST file cuts the thread wherever DST machines do (REQ-FMT-008), which can be more places than the plan's trims."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-FMT-003"
area = "formats"
level = "L1"
statement = "Every command kind (jump, trim, stop, colour change, end) survives every writer/reader pair."
rationale = "Machines that ignore trims or miss stops are a common complaint about embroidery files."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-FMT-004"
area = "formats"
level = "L1"
statement = "Readers decode a valid file without stitches to an empty plan, and report empty or truncated files as a typed error (SC-E0603), never a crash; writers refuse to write an empty plan (SC-E0010)."
rationale = "Empty and damaged files are ordinary input, not a reason to crash."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-FMT-005"
area = "formats"
level = "L1"
statement = "A pinned pyembroidery reads every golden machine file to the same needle-downs, cuts and pauses as StitchCraft's own reader (compared from the first needle-down, since readers differ in where a design starts)."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-FMT-006"
area = "formats"
level = "L1"
statement = "Fuzzed readers never panic, never allocate beyond their caps, and always terminate."
rationale = "Every reader parses bytes from the internet; fuzzing runs nightly, its bodies on every PR (conformance.md, Fuzzing)."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-FMT-007"
area = "formats"
level = "L1"
statement = "Moves longer than a format's per-record limit are split into several records within the limit."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-FMT-008"
area = "formats"
level = "L1"
statement = "DST files are read as DST machines sew them: three or more jump records in a row cut the thread before them where something was sewn since it was last cut or changed, and nothing else is a cut; writing a DST file reports (SC-I0605) every place where its machines will cut the thread and the plan does not."
rationale = "DST has no trim command. Machines count jump records in a row — a machine setting (1 to 8 on Brother's PR machines), commonly 3, which is also pyembroidery's default — so a jump longer than two records (24.2 mm) is a trim too (formats.md, DST)."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-FMT-009"
area = "formats"
level = "L2"
statement = "The PEC reader reads stitch data with or without the 4-byte origin field: the 4 bytes are the field when they are shaped like one (a long-form jump on both axes) and the design read after them fits the box the header's width and height give from the corner the field puts it at; otherwise they are the first record, and a warning says that Brother machines expect the field."
rationale = "pyembroidery 1.4.32 to 1.5.1, used by Ink/Stitch before pystitch, wrote PEC without the field; reading every file as if it had one lost their first record or failed."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-THREAD-001"
area = "threads"
level = "L1"
statement = "Palette tables match their published source at spot-checked entries; nearest-colour matching is deterministic (CIEDE2000 via libm)."
rationale = "Thread colours that change between the screen and the machine confuse users."
milestone = "M1"
status = "active"

# ── Rendering ──────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-RND-001"
area = "render"
level = "L2"
statement = "Previews render the plan after quantization, so what is shown is what sews."
rationale = "A preview drawn before rounding shows stitches that move once the file is saved."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-RND-002"
area = "render"
level = "L2"
statement = "The same plan and settings give the same preview PNG, byte for byte, on every platform."
rationale = "Documentation images are compared byte for byte on every pull request (docs-pipeline.md)."
milestone = "M2"
status = "active"

# ── Parameters ─────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-PRM-001"
area = "params"
level = "L2"
statement = "Every registered parameter has a label, help text, kind, default, range or options, group and applicability."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-PRM-002"
area = "params"
level = "L2"
statement = "Invalid parameter values produce SC-E0101 or SC-W0102 with the key, the value and the accepted range; they never fall back silently to defaults."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-PRM-003"
area = "params"
level = "L2"
statement = "Parameters round-trip unchanged through every adapter (SVG attributes, VectorCraft effect records)."
rationale = "Settings that change or vanish after saving lose the user's work."
milestone = "M3"
status = "planned"

# ── SVG adapter ────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-SVG-001"
area = "svg"
level = "L2"
statement = "Paths, groups, transforms, viewBox units, colours and visibility map to the Design exactly (positions within 1 micrometre)."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-SVG-002"
area = "svg"
level = "L2"
statement = "Any SVG path data, including degenerate arcs, is handled per the SVG specification without failing the adapter; fuzzed."
rationale = "Degenerate arcs are valid SVG; dividing by their zero radius must not fail the import."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-SVG-003"
area = "svg"
level = "L2"
statement = "Ink/Stitch's own objects are not stitched: command symbols and the connectors that tie them to objects, lines drawn with Inkscape's connector tool, and paths that Ink/Stitch's guide-line, anchor-line or pattern start marker makes helpers. Its trim and stop commands set the shape's trim_after and stop_after, and a command that is not applied is noted."
rationale = "Read as plain SVG, every command would add a stray line and a colour change to the sew-out, and every guide line would be stitched."
milestone = "M3"
status = "active"

# ── Generators: shared ─────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-GEN-001"
area = "generators"
level = "L2"
statement = "Every generator honours start and end hints: the first and last stitch lie within 0.1 mm of the shape point nearest each hint."
rationale = "Where stitching starts and ends decides the jumps and trims between elements."
milestone = "M8"
status = "planned"

[[req]]
id = "REQ-GEN-002"
area = "generators"
level = "L2"
statement = "An element that cannot be sewn — a stitch type StitchCraft does not sew yet (SC-W0011), parameters it cannot read (SC-E0101), or its work budget spent (SC-E0004) — is skipped with its diagnostic, and the rest of the design still plans; with nothing left to sew, planning stops with SC-E0010."
rationale = "One bad element must not cost the user the whole design."
milestone = "M3"
status = "active"

# ── Running stitch family ──────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-RUN-001"
area = "strokes/running"
level = "L2"
statement = "Stitches are spread evenly between corners. Every stitch, measured straight, is at most the longest running_stitch_length_mm (raised to twice the shortest stitch) times (1 + jitter) and at least the shortest stitch; a part of the path too small for that (shorter than the shortest stitch, or all within it of its ends) is not stitched and is reported (SC-W0401)."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-002"
area = "strokes/running"
level = "L2"
statement = "The stitches deviate from the source path by at most running_stitch_tolerance_mm, both ways (every point of the path is that close to a stitch, and every stitch that close to the path), except where that would take a stitch outside the lengths of REQ-RUN-001."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-003"
area = "strokes/running"
level = "L2"
statement = "Corners (where the path turns by more than 30 degrees from one segment to the next) are needle penetrations, except where a penetration there would make a stitch shorter than the shortest stitch."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-004"
area = "strokes/running"
level = "L2"
statement = "Bean stitch sews each stitch from A to B as A to B, then b times back to A and on to B (2b + 1 times over it). b comes from bean_stitch_repeats, a list taken in turn along the stitches and running on across repeats, each turnaround taking one step; so a run of n stitches with b throughout has exactly n x (2b + 1) stitches."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-005"
area = "strokes/running"
level = "L2"
statement = "Repeats sew a run k times, alternating direction, each pass starting where the last one ended (no stitch in place): an odd count ends at the far end, an even count at the start."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-007"
area = "strokes/running"
level = "L2"
statement = "With random stitch length, the stitches between corners differ in length; the same element and seed give the same stitches on every platform, and another seed gives other stitches."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-006"
area = "strokes/manual"
level = "L2"
statement = "Manual stitch puts a needle point on every node of the path, in order (a curve gives only its end node, a node where the needle already is counts once), plus only the documented splits: a stitch longer than max_stitch_length_mm, when it is above 0, is split into the fewest equal parts no longer than it, none shorter than the shortest stitch."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-008"
area = "strokes/manual"
level = "L2"
statement = "No hand-placed stitch is shorter than the shortest stitch: a node closer than that to the needle point before it is left out (a part's last node is kept, the one before it left out instead), and SC-W0403 reports it."
milestone = "M3"
status = "active"

# ── Lock stitches and assembly ─────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-LCK-001"
area = "plan/locks"
level = "L2"
statement = "Lock stitches appear where `ties` says (both, before, after, neither) and only there: a tie-in where the needle jumps to a group, a tie-off where a jump, trim, stop, thread change or the end follows one, none between groups sewn on from one to the next. `force_lock_stitches` adds the tie-off; manual stitch has none unless forced."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-LCK-002"
area = "plan/locks"
level = "L2"
statement = "Every lock id is accepted and sews a lock that joins the stitching where it starts or ends, with no stitch shorter than 0.2 mm; drawn locks scale with `lock_*_scale_percent`, locks made of steps with `lock_*_scale_mm`, and the half stitch with the first stitch."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-LCK-004"
area = "plan/locks"
level = "L2"
statement = "A custom lock written as numbers sews them as steps along the stitching, round its corners, in sizes of `lock_*_scale_mm`, positive into the stitching: a tie-in's steps end where the stitching starts and a tie-off's begin where it ends, as Ink/Stitch reads them."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-LCK-003"
area = "plan/locks"
level = "L4"
statement = "Default locks hold when the tail is pulled (machine test TS-04)."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-ASM-001"
area = "plan/assembly"
level = "L2"
statement = "Elements are stitched in document order; a change of thread colour starts a new colour block, and threads are compared by colour alone, as in Ink/Stitch."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-ASM-002"
area = "plan/assembly"
level = "L2"
statement = "Between groups of the same thread, a move no longer than the earlier element's `min_jump_stitch_length_mm`, or the design's collapse length when it sets none, is sewn on without locks; a longer one, or any after an element that forces locks, ties off, jumps and ties in."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-ASM-003"
area = "plan/assembly"
level = "L2"
statement = "`trim_after` and `stop_after` put a trim or a stop after the element's last group, its tie-off before and the next group's tie-in after, as their `ties` allow."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-ASM-004"
area = "plan/assembly"
level = "L2"
statement = "Ignored elements are dropped and listed in the report."
rationale = "Ink/Stitch's ignore commands and its ignore_object setting keep templates and placement lines in a drawing but out of the sew-out; the SVG adapter leaves them out and lists each (SC-I0805)."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-ASM-005"
area = "plan/assembly"
level = "L2"
statement = "The design's origin, or without one the centre of the box around its stitches, becomes the hoop's centre; a stop position adds a jump to it before each stop."
milestone = "M3"
status = "active"

# ── Finalize and check ─────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-FIN-001"
area = "plan/finalize"
level = "L2"
statement = "Finalizing fits every stitch to the machine: one longer than its longest is split into the fewest equal parts no longer than it (SC-I0703), and a needle point less than its element's shortest stitch (the one its generator used) from the one before is left out (SC-I0504), the ends of each run of stitches and lock points kept."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-FIN-002"
area = "plan/finalize"
level = "L2"
statement = "A design the machine cannot take — larger than the hoop, reaching past its edge from the origin, or with its stop position past the edge (SC-E0701), or with more colour changes and stops than its format records (SC-E0601) — gives no plan; one larger than the comfort zone is planned, with SC-W0702."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-FIN-003"
area = "plan/finalize"
level = "L2"
statement = "Every plan the engine returns passes the plan invariants for its machine profile; one that would not is a StitchCraft bug, reported as SC-E0009 instead of returned."
milestone = "M3"
status = "active"

# ── Satin ──────────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-SAT-001"
area = "satin"
level = "L2"
statement = "Every top stitch end lies on its rail offset outward by exactly the compensation (within 0.01 mm)."
milestone = "M4"
status = "planned"

[[req]]
id = "REQ-SAT-002"
area = "satin"
level = "L2"
statement = "Measured zigzag spacing on the centre line equals the parameter within 5 percent outside short-stitch zones."
milestone = "M4"
status = "planned"

[[req]]
id = "REQ-SAT-003"
area = "satin"
level = "L2"
statement = "No top stitch exceeds max_stitch_length_mm after splitting; split seams follow the chosen method."
milestone = "M4"
status = "planned"

[[req]]
id = "REQ-SAT-004"
area = "satin"
level = "L2"
statement = "Underlays lie inside their inset band and precede the top stitches."
milestone = "M4"
status = "planned"

[[req]]
id = "REQ-SAT-005"
area = "satin"
level = "L2"
statement = "A satin column's rails and rungs are told apart as Ink/Stitch tells them, whatever order they are drawn in: by which subpaths meet, else the two longest (SC-W0202). A path with no subpath longer than a point produces SC-E0201 and no stitches. A rung that misses a rail joins the rail's nearest point (SC-W0203)."
rationale = "A file must sew the same in both programs, and odd satin geometry, such as a rung that misses a rail or a stray node, must be a diagnostic, never a crash."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-006"
area = "satin"
level = "L2"
statement = "Asymmetric (per-side) parameters affect only their side."
milestone = "M4"
status = "planned"

[[req]]
id = "REQ-SAT-007"
area = "satin"
level = "L2"
statement = "Randomized satin parameters are reproducible from the seed."
milestone = "M4"
status = "planned"

