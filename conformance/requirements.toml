statement = "Every row segment is covered exactly once by top stitches."
milestone = "M5"
status = "planned"

[[req]]
id = "REQ-FILL-TAT-002"
area = "fill/tatami"
level = "L2"
statement = "Measured row spacing equals the parameter within 2 percent, or follows the start-to-end gradient."
milestone = "M5"
status = "planned"

[[req]]
id = "REQ-FILL-TAT-003"
area = "fill/tatami"
level = "L2"
statement = "Needle points follow the stagger grid; no furrow of aligned points spans more than `staggers` rows."
milestone = "M5"
status = "planned"

[[req]]
id = "REQ-FILL-TAT-004"
area = "fill/tatami"
level = "L2"
statement = "Rasterized at 0.05 mm with a 0.4 mm thread, at least 98 percent of the region is covered at spacing up to 0.4 mm."
