status = "planned"

[[req]]
id = "REQ-FILL-TAT-005"
area = "fill/tatami"
level = "L2"
statement = "Travel stitches lie inside the region (within 0.05 mm)."
milestone = "M5"
status = "planned"

[[req]]
id = "REQ-FILL-TAT-006"
area = "fill/tatami"
level = "L2"
statement = "Pull compensation preserves the number of holes and connected components of the region."
