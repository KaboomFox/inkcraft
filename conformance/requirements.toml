milestone = "M4"
status = "planned"

[[req]]
id = "REQ-SAT-006"
area = "satin"
level = "L2"
statement = "Asymmetric (per-side) parameters affect only their side."
milestone = "M4"
status = "planned"

[[req]]
id = "REQ-SAT-007"
area = "satin"
level = "L2"
statement = "Randomized satin parameters are reproducible from the seed."
milestone = "M4"
status = "planned"

# ── Tatami fill ────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-FILL-TAT-001"
area = "fill/tatami"
level = "L2"
statement = "Every row segment is covered exactly once by top stitches."
