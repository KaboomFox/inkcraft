# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/). Run in CI.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory: licences we accept but do not use yet are fine.
unused-allowed-license = "allow"
# Permissive licences only. GPL, AGPL and LGPL are not on this list, so they are denied
# (docs/src/design/adr/0001-license-and-clean-room.md).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
