# Every image in the docs is declared here and regenerated by `cargo xtask shots`
# (see docs/src/design/docs-pipeline.md). An image under docs/src/images/ without a declaration,
# or a declaration without alt text, fails `cargo xtask docs --check`; pages that show a shot use
# its alt text.
#
# Kinds: "stitch" (our renderer, exact bytes), "vectorcraft-render" (vectorcraft-cli export),
# "vectorcraft-ui" (VectorCraft window via its control channel, perceptual tolerance),
# "photo" (a real sew-out; never regenerated, needs a sew-out report link).
#
# A "stitch" shot names a test sheet, a style ("realistic" or "simple") and a scale in pixels per
# millimetre; it becomes docs/src/images/generated/<id>.png. Fixtures with parameters, as in
#   fixture = "conformance/fixtures/fill/square-40mm.svg"
#   params = [{ staggers = 1 }, { staggers = 4 }]
# arrive with the first stitch types (M3).

# ── Test sheets (shown on the test-sheets reference page, in this order) ────────────────────────────

[[shot]]
id = "testsheet-ts-01"
kind = "stitch"
sheet = "TS-01"
style = "realistic"
scale = 4.0
alt = "TS-01 as it will sew, in black: a cross with arms 100 mm long and a tick every 10 mm, an upright F in the top-left quarter, and a 10 mm square in each corner."

[[shot]]
id = "testsheet-ts-02"
kind = "stitch"
sheet = "TS-02"
style = "realistic"
scale = 4.0
alt = "TS-02 as it will sew if the machine leaves plain jumps uncut: four red rows of two dashes with nothing between them, four blue rows whose dashes and rows are joined by loose threads, and a green line underneath."

[[shot]]
id = "testsheet-ts-02-simple"
kind = "stitch"
sheet = "TS-02"
style = "simple"
scale = 4.0
alt = "TS-02 in the simple style: a red cross marks the trim after the first dash of each red row, grey dashes show moves after a cut, blue dashes show jump threads left in place, and a blue square marks the stop in the middle of the green line."

[[shot]]
id = "testsheet-ts-02b"
kind = "stitch"
sheet = "TS-02B"
style = "realistic"
scale = 4.0
alt = "TS-02B as it will sew if the machine leaves plain jumps uncut: four red rows of two dashes with nothing between them, four blue rows whose top row is one line and whose other dashes and rows are joined by loose threads, and a green line underneath."

[[shot]]
id = "testsheet-ts-02b-simple"
kind = "stitch"
sheet = "TS-02B"
style = "simple"
scale = 4.0
alt = "TS-02B in the simple style: a red cross marks the trim after every red dash but the last, grey dashes show moves after a cut, blue dashes show jump threads left in place, and a blue square marks the stop in the middle of the green line."

[[shot]]
id = "testsheet-ts-03"
kind = "stitch"
sheet = "TS-03"
style = "realistic"
scale = 6.0
alt = "TS-03 as it will sew, in blue: five long lines with stitches from 1.5 to 4 mm, two bolder bean-stitch lines, three small circles, the right-hand one visibly many-sided, and five short lines of tiny stitches growing longer towards the bottom."

[[shot]]
id = "testsheet-ts-04"
kind = "stitch"
sheet = "TS-04"
style = "realistic"
scale = 6.0
alt = "TS-04 as it will sew, in red: nine rows of three lines, each line ending in a small lock at both ends, the locks' shapes differing from row to row and growing from left to right."

[[shot]]
id = "testsheet-ts-10a"
kind = "stitch"
sheet = "TS-10A"
style = "realistic"
scale = 3.0
alt = "TS-10A as it will sew: a blue square frame 150 mm on each side, with an F at the top left and a small cross in the centre."

[[shot]]
id = "testsheet-ts-10b"
kind = "stitch"
sheet = "TS-10B"
style = "realistic"
scale = 3.0
alt = "TS-10B as it will sew: a blue frame 190 mm wide and 150 mm high, with an F at the top left and a small cross in the centre."

[[shot]]
id = "testsheet-ts-10c"
kind = "stitch"
