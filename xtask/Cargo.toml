[package]
name = "xtask"
description = "StitchCraft repository automation: every gate, generator and check (cargo xtask ...)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The conformance runner draws test sheets and encodes them in-process, and the docs generator renders
# reference pages from the registries (xtask is exempt from layering).
clap = { workspace = true }
stitchcraft-cli = { path = "../apps/stitchcraft-cli" }
stitchcraft-core = { workspace = true }
stitchcraft-engine = { workspace = true }
stitchcraft-formats = { workspace = true }
stitchcraft-plan = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
